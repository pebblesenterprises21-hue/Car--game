<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🚗 Car Dodge 2.0</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(160deg,#12002b,#3a0d5c,#7b1fa2);
  touch-action:none;
  overscroll-behavior:none;
}

body{
  display:flex;
  justify-content:flex-start;
  align-items:center;
}

#wrap{
  width:100%;
  max-width:420px;
  margin:0 auto;
  padding:8px 8px 20px;
  text-align:center;
}

h2{
  margin:5px 0 6px;
  font-size:28px;
  font-weight:bold;
  background:linear-gradient(90deg,#00e676,#00c6ff,#ffea00);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

#hud{
  font-size:16px;
  font-weight:bold;
  color:#ffd54f;
  line-height:1.8;
}

#hud span{
  color:white;
}

#message{
  height:24px;
  font-size:16px;
  font-weight:bold;
  color:#fff;
}

#game{
  display:block;
  width:100%;
  max-width:360px;
  height:auto;
  margin:5px auto 8px;
  background:#444;
  border:4px solid white;
  border-radius:12px;
  box-shadow:0 0 20px rgba(0,0,0,.5);
  touch-action:none;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin:8px 0;
}

.ctrl-btn{
  width:65px;
  height:58px;
  border:0;
  border-radius:15px;
  background:#333;
  color:white;
  font-size:25px;
  box-shadow:0 4px 10px rgba(0,0,0,.5);
  user-select:none;
  -webkit-user-select:none;
}

.ctrl-btn:active{
  transform:scale(.92);
}

#nitroBtn{
  width:125px;
  background:linear-gradient(135deg,#ff512f,#f09819);
  font-size:17px;
  font-weight:bold;
}

.small{
  margin:5px 0;
  font-size:12px;
  opacity:.8;
}

#overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.88);
  z-index:20;
  text-align:center;
}

#overlay h1{
  margin:5px;
  font-size:38px;
  color:#ffca28;
}

#overlay p{
  margin:6px;
  font-size:20px;
}

#restartBtn{
  margin-top:18px;
  padding:13px 30px;
  border:0;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:19px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="wrap">

  <h2>🚗 CAR DODGE 2.0</h2>

  <div id="hud">
    Score: <span id="score">0</span>
    |
    Best: <span id="best">0</span>
    <br>

    🪙 <span id="coins">0</span>
    |
    <span id="lives">❤️❤️❤️</span>
    |
    🏁 Level <span id="level">1</span>
    |
    🚀 <span id="nitro">100</span>%
  </div>

  <div id="message"></div>

  <canvas id="game" width="360" height="600"></canvas>

  <div class="controls">

    <button
      class="ctrl-btn"
      id="leftBtn"
      type="button"
    >⬅️</button>

    <button
      class="ctrl-btn"
      id="nitroBtn"
      type="button"
    >🚀 NITRO</button>

    <button
      class="ctrl-btn"
      id="rightBtn"
      type="button"
    >➡️</button>

  </div>

  <p class="small">
    Swipe or tap left/right • A/D or ←/→ • Hold Nitro
  </p>

</div>


<div id="overlay">

  <h1>💥 GAME OVER</h1>

  <p id="finalScore">🏁 Score: 0</p>
  <p id="finalCoins">🪙 Coins: 0</p>
  <p id="finalBest">🏆 Best: 0</p>

  <button
    id="restartBtn"
    type="button"
  >
    🚗 PLAY AGAIN
  </button>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const laneCount = 3;
const laneWidth = W / laneCount;


/* =====================================================
   PLAYER
===================================================== */

const player = {
  lane: 1,
  width: 44,
  height: 76,
  y: H - 100
};


/* =====================================================
   GAME VARIABLES
===================================================== */

let obstacles = [];
let coinsOnRoad = [];
let powerups = [];

let score = 0;
let bonusScore = 0;

let coins = Number(
  localStorage.getItem("carDodgeCoins") || 0
);

let best = Number(
  localStorage.getItem("carDodgeBest") || 0
);

let lives = 3;
let level = 1;

let speed = 4;

let frame = 0;

let spawnTimer = 0;
let coinTimer = 0;
let powerTimer = 0;

let nitro = 100;
let nitroActive = false;

let shield = false;

let invincibleTimer = 0;

let running = false;
let animationStarted = false;


/* =====================================================
   HUD
===================================================== */

document.getElementById("best").textContent = best;
document.getElementById("coins").textContent = coins;


/* =====================================================
   LANE POSITION
===================================================== */

function laneX(lane){

  return lane * laneWidth + laneWidth / 2;

}


/* =====================================================
   RESET GAME
===================================================== */

function resetGame(){

  obstacles = [];
  coinsOnRoad = [];
  powerups = [];

  score = 0;
  bonusScore = 0;

  lives = 3;
  level = 1;

  speed = 4;

  frame = 0;

  spawnTimer = 0;
  coinTimer = 0;
  powerTimer = 0;

  nitro = 100;
  nitroActive = false;

  shield = false;

  invincibleTimer = 0;

  player.lane = 1;

  running = true;

  document.getElementById("overlay").style.display = "none";

  updateHUD();

  draw();

  startLoop();

}


/* =====================================================
   START LOOP
===================================================== */

function startLoop(){

  if(animationStarted){
    return;
  }

  animationStarted = true;

  requestAnimationFrame(gameLoop);

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

  if(!running){

    animationStarted = false;
    return;

  }

  update();
  draw();

  requestAnimationFrame(gameLoop);

}


/* =====================================================
   SPAWN OBSTACLE
===================================================== */

function spawnObstacle(){

  const lane =
    Math.floor(Math.random() * laneCount);

  const colors = [
    "#ff5252",
    "#42a5f5",
    "#ffca28",
    "#ab47bc",
    "#ff7043",
    "#26c6da",
    "#ec407a"
  ];

  obstacles.push({

    lane: lane,

    y: -100,

    width: 44,

    height: 76,

    color:
      colors[
        Math.floor(Math.random() * colors.length)
      ],

    passed: false

  });

}


/* =====================================================
   SPAWN COIN
===================================================== */

function spawnCoin(){

  const lane =
    Math.floor(Math.random() * laneCount);

  coinsOnRoad.push({

    lane: lane,

    y: -25,

    collected: false

  });

}


/* =====================================================
   SPAWN POWERUP
===================================================== */

function spawnPowerup(){

  const lane =
    Math.floor(Math.random() * laneCount);

  const type =
    Math.random() < 0.5
      ? "shield"
      : "nitro";

  powerups.push({

    lane: lane,

    y: -30,

    type: type,

    collected: false

  });

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

  frame++;

  spawnTimer++;
  coinTimer++;
  powerTimer++;

  /* LEVEL */

  level =
    1 + Math.floor(score / 100);

  /* SPEED */

  speed =
    4 + (level - 1) * 0.45;

  /* NITRO */

  if(nitroActive){

    nitro -= 0.8;

    if(nitro <= 0){

      nitro = 0;
      nitroActive = false;

    }

  }else{

    nitro =
      Math.min(100, nitro + 0.06);

  }

  const actualSpeed =
    nitroActive
      ? speed * 1.8
      : speed;


  /* SPAWN CARS */

  const spawnRate =
    Math.max(
      38 - Math.floor(score / 10),
      16
    );

  if(spawnTimer >= spawnRate){

    spawnObstacle();

    spawnTimer = 0;

  }


  /* SPAWN COINS */

  if(coinTimer >= 45){

    spawnCoin();

    coinTimer = 0;

  }


  /* SPAWN POWERUPS */

  if(powerTimer >= 500){

    spawnPowerup();

    powerTimer = 0;

  }


  /* MOVE */

  obstacles.forEach(function(o){

    o.y += actualSpeed;

  });

  coinsOnRoad.forEach(function(c){

    c.y += actualSpeed;

  });

  powerups.forEach(function(p){

    p.y += actualSpeed;

  });


  /* REMOVE */

  obstacles =
    obstacles.filter(function(o){

      return o.y < H + 100;

    });

  coinsOnRoad =
    coinsOnRoad.filter(function(c){

      return c.y < H + 50 &&
             !c.collected;

    });

  powerups =
    powerups.filter(function(p){

      return p.y < H + 50 &&
             !p.collected;

    });


  /* SCORE */

  score =
    Math.floor(frame / 10) + bonusScore;


  /* PLAYER */

  const px =
    laneX(player.lane);


  /* COLLISIONS */

  for(let i = 0; i < obstacles.length; i++){

    const o = obstacles[i];

    const ox =
      laneX(o.lane);

    const hit =
      Math.abs(px - ox) <
      (player.width + o.width) / 2 - 10
      &&
      Math.abs(player.y - o.y) <
      (player.height + o.height) / 2 - 10;


    if(hit){

      if(invincibleTimer > 0){
        continue;
      }


      if(shield){

        shield = false;

        invincibleTimer = 90;

        o.y = H + 200;

        showMessage(
          "🛡️ SHIELD SAVED YOU!"
        );

      }else{

        lives--;

        invincibleTimer = 100;

        o.y = H + 200;

        showMessage("💥 CRASH!");

        if(lives <= 0){

          endGame();
          return;

        }

      }

    }


    /* NEAR MISS */

    if(
      !o.passed &&
      o.y > player.y + 35
    ){

      o.passed = true;

      const distance =
        Math.abs(px - ox);

      if(
        distance > 28 &&
        distance < 70
      ){

        bonusScore += 10;

        showMessage(
          "🔥 NEAR MISS +10"
        );

      }

    }

  }


  /* INVINCIBILITY */

  if(invincibleTimer > 0){

    invincibleTimer--;

  }


  /* COLLECT COINS */

  for(let i = 0; i < coinsOnRoad.length; i++){

    const c =
      coinsOnRoad[i];

    if(c.collected){
      continue;
    }

    const cx =
      laneX(c.lane);

    const collected =
      Math.abs(px - cx) < 30
      &&
      Math.abs(player.y - c.y) < 55;

    if(collected){

      c.collected = true;

      coins++;

      localStorage.setItem(
        "carDodgeCoins",
        coins
      );

      showMessage("🪙 +1 COIN!");

    }

  }


  /* POWERUPS */

  for(let i = 0; i < powerups.length; i++){

    const p =
      powerups[i];

    if(p.collected){
      continue;
    }

    const powerX =
      laneX(p.lane);

    const collected =
      Math.abs(px - powerX) < 30
      &&
      Math.abs(player.y - p.y) < 55;

    if(collected){

      p.collected = true;

      if(p.type === "shield"){

        shield = true;

        showMessage(
          "🛡️ SHIELD ACTIVE!"
        );

      }else{

        nitro =
          Math.min(
            100,
            nitro + 50
          );

        showMessage(
          "⚡ NITRO +50!"
        );

      }

    }

  }

}


/* =====================================================
   DRAW ROAD
===================================================== */

function drawRoad(){

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  gradient.addColorStop(
    0,
    "#303044"
  );

  gradient.addColorStop(
    0.5,
    "#50506a"
  );

  gradient.addColorStop(
    1,
    "#303044"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* ROAD EDGE */

  const edgeColors = [
    "#ff5252",
    "#ffca28",
    "#66bb6a",
    "#42a5f5"
  ];

  const stripeHeight = 26;

  const offset =
    (frame * speed) %
    stripeHeight;


  for(let side = 0; side < 2; side++){

    const x =
      side === 0
        ? 0
        : W - 10;

    for(
      let y = -stripeHeight;
      y < H;
      y += stripeHeight
    ){

      const index =
        Math.floor(
          (y + frame * speed) /
          stripeHeight
        ) % edgeColors.length;

      const safeIndex =
        (index + edgeColors.length) %
        edgeColors.length;

      ctx.fillStyle =
        edgeColors[safeIndex];

      ctx.fillRect(
        x,
        y + offset,
        10,
        stripeHeight - 4
      );

    }

  }


  /* LANE LINES */

  ctx.lineWidth = 5;

  const dash = 22;
  const gap = 18;

  for(let lane = 1; lane < laneCount; lane++){

    let y =
      -(frame * speed) %
      (dash + gap);

    while(y < H){

      ctx.strokeStyle = "#eeeeee";

      ctx.beginPath();

      ctx.moveTo(
        lane * laneWidth,
        y
      );

      ctx.lineTo(
        lane * laneWidth,
        y + dash
      );

      ctx.stroke();

      y += dash + gap;

    }

  }

}


/* =====================================================
   DRAW CAR
===================================================== */

function drawCar(
  x,
  y,
  w,
  h,
  color,
  glow
){

  ctx.save();


  if(glow){

    ctx.shadowColor = color;
    ctx.shadowBlur = 18;

  }


  const gradient =
    ctx.createLinearGradient(
      x - w / 2,
      y - h / 2,
      x + w / 2,
      y + h / 2
    );

  gradient.addColorStop(
    0,
    shadeColor(color,30)
  );

  gradient.addColorStop(
    1,
    shadeColor(color,-20)
  );

  ctx.fillStyle = gradient;


  roundRect(
    x - w / 2,
    y - h / 2,
    w,
    h,
    8
  );

  ctx.fill();


  ctx.shadowBlur = 0;


  /* WINDSHIELD */

  ctx.fillStyle =
    "rgba(120,210,255,.8)";

  ctx.fillRect(
    x - w / 2 + 6,
    y - h / 2 + 10,
    w - 12,
    h / 3
  );


  /* CENTER STRIPE */

  ctx.fillStyle =
    "rgba(255,255,255,.85)";

  ctx.fillRect(
    x - 4,
    y - h / 2 + 4,
    8,
    h - 8
  );


  /* WHEELS */

  ctx.fillStyle = "#111";

  ctx.fillRect(
    x - w / 2 - 4,
    y - h / 2 + 8,
    6,
    16
  );

  ctx.fillRect(
    x + w / 2 - 2,
    y - h / 2 + 8,
    6,
    16
  );

  ctx.fillRect(
    x - w / 2 - 4,
    y + h / 2 - 24,
    6,
    16
  );

  ctx.fillRect(
    x + w / 2 - 2,
    y + h / 2 - 24,
    6,
    16
  );


  ctx.restore();

}


/* =====================================================
   DRAW COIN
===================================================== */

function drawCoin(x,y){

  ctx.save();

  ctx.shadowColor = "#ffd700";
  ctx.shadowBlur = 15;

  ctx.fillStyle = "#ffd700";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    14,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle = "#fff176";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    9,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle = "#f57f17";

  ctx.font = "bold 12px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    "$",
    x,
    y
  );

  ctx.restore();

}


/* =====================================================
   DRAW POWERUP
===================================================== */

function drawPowerup(p){

  const x =
    laneX(p.lane);

  ctx.save();

  ctx.shadowBlur = 18;


  if(p.type === "shield"){

    ctx.shadowColor = "#00e5ff";
    ctx.fillStyle = "#00e5ff";

    ctx.beginPath();

    ctx.arc(
      x,
      p.y,
      17,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "🛡️",
      x,
      p.y
    );

  }else{

    ctx.shadowColor = "#ff9800";
    ctx.fillStyle = "#ff9800";

    ctx.beginPath();

    ctx.arc(
      x,
      p.y,
      17,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "⚡",
      x,
      p.y
    );

  }

  ctx.restore();

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  drawRoad();


  /* COINS */

  coinsOnRoad.forEach(function(c){

    drawCoin(
      laneX(c.lane),
      c.y
    );

  });


  /* POWERUPS */

  powerups.forEach(function(p){

    drawPowerup(p);

  });


  /* ENEMY CARS */

  obstacles.forEach(function(o){

    drawCar(
      laneX(o.lane),
      o.y,
      o.width,
      o.height,
      o.color,
      false
    );

  });


  /* SHIELD */

  if(shield){

    ctx.save();

    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 4;
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 20;

    ctx.beginPath();

    ctx.arc(
      laneX(player.lane),
      player.y,
      45,
      0,
      Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();

  }


  /* NITRO FLAME */

  if(nitroActive){

    ctx.save();

    ctx.fillStyle = "#ff9800";
    ctx.shadowColor = "#ff5722";
    ctx.shadowBlur = 20;

    ctx.beginPath();

    ctx.moveTo(
      laneX(player.lane) - 10,
      player.y + 38
    );

    ctx.lineTo(
      laneX(player.lane),
      player.y + 68 +
      Math.random() * 12
    );

    ctx.lineTo(
      laneX(player.lane) + 10,
      player.y + 38
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

  }


  /* PLAYER */

  let playerColor = "#00e676";

  if(
    invincibleTimer > 0 &&
    frame % 8 < 4
  ){

    playerColor = "#ffffff";

  }

  drawCar(
    laneX(player.lane),
    player.y,
    player.width,
    player.height,
    playerColor,
    true
  );


  updateHUD();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  document.getElementById("score").textContent =
    score;

  document.getElementById("coins").textContent =
    coins;

  document.getElementById("best").textContent =
    best;

  document.getElementById("level").textContent =
    level;

  document.getElementById("nitro").textContent =
    Math.floor(nitro);

  document.getElementById("lives").textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(3 - lives);

}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;

function showMessage(text){

  const message =
    document.getElementById("message");

  message.textContent = text;

  clearTimeout(messageTimer);

  messageTimer =
    setTimeout(function(){

      message.textContent = "";

    },1200);

}


/* =====================================================
   SHADE COLOR
===================================================== */

function shadeColor(
  hex,
  percent
){

  const num =
    parseInt(
      hex.replace("#",""),
      16
    );

  let r =
    (num >> 16) +
    Math.round(2.55 * percent);

  let g =
    ((num >> 8) & 255) +
    Math.round(2.55 * percent);

  let b =
    (num & 255) +
    Math.round(2.55 * percent);


  r =
    Math.max(
      0,
      Math.min(255,r)
    );

  g =
    Math.max(
      0,
      Math.min(255,g)
    );

  b =
    Math.max(
      0,
      Math.min(255,b)
    );


  return `rgb(${r},${g},${b})`;

}


/* =====================================================
   ROUND RECTANGLE
===================================================== */

function roundRect(
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.moveTo(
    x + r,
    y
  );

  ctx.arcTo(
    x + w,
    y,
    x + w,
    y + h,
    r
  );

  ctx.arcTo(
    x + w,
    y + h,
    x,
    y + h,
    r
  );

  ctx.arcTo(
    x,
    y + h,
    x,
    y,
    r
  );

  ctx.arcTo(
    x,
    y,
    x + w,
    y,
    r
  );

  ctx.closePath();

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

  running = false;
  nitroActive = false;

  if(score > best){

    best = score;

    localStorage.setItem(
      "carDodgeBest",
      best
    );

  }


  document.getElementById(
    "finalScore"
  ).textContent =
    "🏁 Score: " + score;

  document.getElementById(
    "finalCoins"
  ).textContent =
    "🪙 Coins: " + coins;

  document.getElementById(
    "finalBest"
  ).textContent =
    "🏆 Best: " + best;


  document.getElementById(
    "overlay"
  ).style.display = "flex";

  updateHUD();

}


/* =====================================================
   MOVEMENT
===================================================== */

function moveLeft(){

  if(!running){
    return;
  }

  if(player.lane > 0){

    player.lane--;

  }

}


function moveRight(){

  if(!running){
    return;
  }

  if(player.lane < laneCount - 1){

    player.lane++;

  }

}


/* =====================================================
   NITRO
===================================================== */

function startNitro(){

  if(!running){
    return;
  }

  if(nitro > 5){

    nitroActive = true;

    showMessage(
      "🚀 NITRO BOOST!"
    );

  }

}


function stopNitro(){

  nitroActive = false;

}


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "ArrowLeft" ||
      e.key === "ArrowRight" ||
      e.key === " " ||
      e.key === "a" ||
      e.key === "A" ||
      e.key === "d" ||
      e.key === "D"
    ){

      e.preventDefault();

    }


    if(
      e.key === "ArrowLeft" ||
      e.key === "a" ||
      e.key === "A"
    ){

      moveLeft();

    }


    if(
      e.key === "ArrowRight" ||
      e.key === "d" ||
      e.key === "D"
    ){

      moveRight();

    }


    if(e.key === " "){

      startNitro();

    }

  },
  {passive:false}
);


window.addEventListener(
  "keyup",
  function(e){

    if(e.key === " "){

      stopNitro();

    }

  }
);


/* =====================================================
   BUTTONS
===================================================== */

document
  .getElementById("leftBtn")
  .addEventListener(
    "click",
    moveLeft
  );


document
  .getElementById("rightBtn")
  .addEventListener(
    "click",
    moveRight
  );


const nitroButton =
  document.getElementById(
    "nitroBtn"
  );


nitroButton.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();
    startNitro();

  }
);


nitroButton.addEventListener(
  "pointerup",
  function(e){

    e.preventDefault();
    stopNitro();

  }
);


nitroButton.addEventListener(
  "pointercancel",
  stopNitro
);


nitroButton.addEventListener(
  "pointerleave",
  stopNitro
);


/* =====================================================
   TOUCH / SWIPE
===================================================== */

let touchStartX = null;
let touchMoved = false;

const swipeThreshold = 30;


canvas.addEventListener(
  "touchstart",
  function(e){

    const touch =
      e.touches[0];

    touchStartX =
      touch.clientX;

    touchMoved = false;

  },
  {passive:false}
);


canvas.addEventListener(
  "touchmove",
  function(e){

    e.preventDefault();

    if(touchStartX === null){
      return;
    }

    const touch =
      e.touches[0];

    const dx =
      touch.clientX -
      touchStartX;


    if(
      Math.abs(dx) >= swipeThreshold &&
      !touchMoved
    ){

      touchMoved = true;

      if(dx > 0){

        moveRight();

      }else{

        moveLeft();

      }

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    if(!running){

      resetGame();

      touchStartX = null;
      touchMoved = false;

      return;

    }


    /* TAP */

    if(
      !touchMoved &&
      touchStartX !== null
    ){

      const rect =
        canvas.getBoundingClientRect();

      const x =
        touchStartX -
        rect.left;

      if(
        x < rect.width / 2
      ){

        moveLeft();

      }else{

        moveRight();

      }

    }


    touchStartX = null;
    touchMoved = false;

  },
  {passive:false}
);


/* =====================================================
   RESTART BUTTON
===================================================== */

document
  .getElementById("restartBtn")
  .addEventListener(
    "click",
    resetGame
  );


/* =====================================================
   START GAME
===================================================== */

window.addEventListener(
  "load",
  function(){

    resetGame();

  }
);

</script>
