<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🚗 Car Dodge 2.0</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:linear-gradient(160deg,#12002b,#3a0d5c,#7b1fa2);
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
  overscroll-behavior:none;
}

#wrap{
  text-align:center;
  width:100%;
  max-width:420px;
  padding-top:8px;
  box-sizing:border-box;
}

h2{
  margin:5px 0;
  font-size:28px;
  background:linear-gradient(90deg,#00e676,#00c6ff,#ffea00);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

#hud{
  font-size:15px;
  font-weight:bold;
  color:#ffd54f;
  line-height:1.7;
}

#hud span{
  color:white;
}

#game{
  background:#444;
  display:block;
  margin:6px auto;
  border:3px solid white;
  border-radius:10px;
  width:100%;
  max-width:360px;
  height:auto;
  box-sizing:border-box;
}

#message{
  height:22px;
  font-weight:bold;
  color:#fff;
}

.controls{
  display:flex;
  justify-content:center;
  gap:18px;
  margin:8px 0;
  flex-wrap:wrap;
}

.ctrl-btn{
  width:65px;
  height:58px;
  font-size:25px;
  border:none;
  border-radius:15px;
  background:#333;
  color:white;
  box-shadow:0 4px 10px #0008;
}

.ctrl-btn:active{
  transform:scale(.92);
}

#nitroBtn{
  width:120px;
  background:linear-gradient(135deg,#ff512f,#f09819);
  font-size:18px;
  font-weight:bold;
}

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.86);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
  text-align:center;
}

#overlay h1{
  font-size:38px;
  margin:5px;
  color:#ffca28;
}

#overlay p{
  font-size:20px;
  margin:6px;
}

#restartBtn{
  margin-top:18px;
  padding:13px 28px;
  font-size:19px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-weight:bold;
}

.small{
  font-size:12px;
  opacity:.75;
}
</style>
</head>

<body>

<div id="wrap">

<h2>🚗 CAR DODGE 2.0</h2>

<div id="hud">
Score: <span id="score">0</span> |
Best: <span id="best">0</span><br>

🪙 <span id="coins">0</span> |
❤️ <span id="lives">❤️❤️❤️</span> |
🏁 Level <span id="level">1</span> |
🚀 <span id="nitro">100</span>%
</div>

<div id="message"></div>

<canvas id="game" width="360" height="600"></canvas>

<div class="controls">
  <button class="ctrl-btn" id="leftBtn">⬅️</button>
  <button class="ctrl-btn" id="nitroBtn">🚀 NITRO</button>
  <button class="ctrl-btn" id="rightBtn">➡️</button>
</div>

<p class="small">
Swipe or tap the road • Keyboard: A/D or ←/→ • Space = Nitro
</p>

</div>

<div id="overlay">

<h1>💥 GAME OVER</h1>

<p id="finalScore">Score: 0</p>
<p id="finalCoins">🪙 Coins: 0</p>
<p id="finalBest">🏆 Best: 0</p>

<button id="restartBtn">🚗 PLAY AGAIN</button>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=canvas.width;
const H=canvas.height;

const laneCount=3;
const laneWidth=W/laneCount;

const player={
  lane:1,
  width:44,
  height:76,
  y:H-100
};

let obstacles=[];
let coinsOnRoad=[];
let powerups=[];

let score=0;
let coins=Number(localStorage.getItem("carDodgeCoins")||0);
let best=Number(localStorage.getItem("carDodgeBest")||0);

let lives=3;
let level=1;

let speed=4;
let frame=0;
let spawnTimer=0;
let coinTimer=0;
let powerTimer=0;

let nitro=100;
let nitroActive=false;

let shield=false;
let running=true;

let invincibleTimer=0;
let nearMissTimer=0;

document.getElementById("best").textContent=best;
document.getElementById("coins").textContent=coins;


/* -------------------------
   BASIC FUNCTIONS
------------------------- */

function laneX(lane){
  return lane*laneWidth+laneWidth/2;
}

function resetGame(){

  obstacles=[];
  coinsOnRoad=[];
  powerups=[];

  score=0;
  lives=3;
  level=1;

  speed=4;

  frame=0;
  spawnTimer=0;
  coinTimer=0;
  powerTimer=0;

  nitro=100;
  nitroActive=false;

  shield=false;
  invincibleTimer=0;

  player.lane=1;

  running=true;

  document.getElementById("overlay").style.display="none";

  requestAnimationFrame(loop);
}


/* -------------------------
   SPAWN CARS
------------------------- */

function spawnObstacle(){

  const lane=Math.floor(Math.random()*laneCount);

  const colors=[
    "#ff5252",
    "#42a5f5",
    "#ffca28",
    "#ab47bc",
    "#ff7043",
    "#26c6da",
    "#ec407a"
  ];

  obstacles.push({
    lane:lane,
    y:-100,
    width:44,
    height:76,
    color:colors[Math.floor(Math.random()*colors.length)],
    passed:false
  });
}


/* -------------------------
   COINS
------------------------- */

function spawnCoin(){

  const lane=Math.floor(Math.random()*laneCount);

  coinsOnRoad.push({
    lane:lane,
    y:-30,
    size:15,
    collected:false
  });
}


/* -------------------------
   POWER UPS
------------------------- */

function spawnPowerup(){

  const lane=Math.floor(Math.random()*laneCount);

  const types=["shield","nitro"];

  powerups.push({
    lane:lane,
    y:-30,
    type:types[Math.floor(Math.random()*types.length)]
  });
}


/* -------------------------
   ROAD
------------------------- */

function drawRoad(){

  const roadGrad=ctx.createLinearGradient(0,0,0,H);

  roadGrad.addColorStop(0,"#303044");
  roadGrad.addColorStop(.5,"#50506a");
  roadGrad.addColorStop(1,"#303044");

  ctx.fillStyle=roadGrad;
  ctx.fillRect(0,0,W,H);

  /* Road edges */

  const edgeColors=[
    "#ff5252",
    "#ffca28",
    "#66bb6a",
    "#42a5f5"
  ];

  const stripeH=26;

  for(let side=0;side<2;side++){

    const x=side===0?0:W-10;

    for(let y=-stripeH;y<H;y+=stripeH){

      const idx=Math.floor(
        (y+frame*speed)/stripeH
      )%edgeColors.length;

      const safeIdx=
        (idx+edgeColors.length)%edgeColors.length;

      ctx.fillStyle=edgeColors[safeIdx];

      ctx.fillRect(
        x,
        y+(frame*speed)%stripeH,
        10,
        stripeH-4
      );
    }
  }

  /* Lane lines */

  ctx.lineWidth=5;

  for(let i=1;i<laneCount;i++){

    const dashLen=22;
    const gapLen=18;

    let y=-(frame*speed)%(dashLen+gapLen);

    while(y<H){

      ctx.strokeStyle="#eeeeee";

      ctx.beginPath();

      ctx.moveTo(i*laneWidth,y);
      ctx.lineTo(i*laneWidth,y+dashLen);

      ctx.stroke();

      y+=dashLen+gapLen;
    }
  }
}


/* -------------------------
   CAR DRAWING
------------------------- */

function drawCar(x,y,w,h,color,glow){

  ctx.save();

  if(glow){

    ctx.shadowColor=color;
    ctx.shadowBlur=20;
  }

  const grad=ctx.createLinearGradient(
    x-w/2,
    y-h/2,
    x+w/2,
    y+h/2
  );

  grad.addColorStop(0,shadeColor(color,30));
  grad.addColorStop(1,shadeColor(color,-20));

  ctx.fillStyle=grad;

  roundRect(
    x-w/2,
    y-h/2,
    w,
    h,
    8
  );

  ctx.fill();

  ctx.shadowBlur=0;

  /* windshield */

  ctx.fillStyle="rgba(120,210,255,.8)";

  ctx.fillRect(
    x-w/2+6,
    y-h/2+10,
    w-12,
    h/3
  );

  /* center stripe */

  ctx.fillStyle="rgba(255,255,255,.85)";

  ctx.fillRect(
    x-4,
    y-h/2+4,
    8,
    h-8
  );

  /* wheels */

  ctx.fillStyle="#111";

  ctx.fillRect(x-w/2-4,y-h/2+8,6,16);
  ctx.fillRect(x+w/2-2,y-h/2+8,6,16);

  ctx.fillRect(x-w/2-4,y+h/2-24,6,16);
  ctx.fillRect(x+w/2-2,y+h/2-24,6,16);

  ctx.restore();
}


/* -------------------------
   COIN DRAWING
------------------------- */

function drawCoin(x,y){

  ctx.save();

  ctx.shadowColor="#ffd700";
  ctx.shadowBlur=15;

  ctx.fillStyle="#ffd700";

  ctx.beginPath();
  ctx.arc(x,y,14,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff176";

  ctx.beginPath();
  ctx.arc(x,y,9,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#f57f17";
  ctx.font="bold 12px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("$",x,y);

  ctx.restore();
}


/* -------------------------
   POWER UP DRAWING
------------------------- */

function drawPowerup(p){

  const x=laneX(p.lane);

  ctx.save();

  ctx.shadowBlur=18;

  if(p.type==="shield"){

    ctx.shadowColor="#00e5ff";
    ctx.fillStyle="#00e5ff";

    ctx.beginPath();
    ctx.arc(x,p.y,16,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#003c4a";
    ctx.font="18px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("🛡️",x,p.y);

  }else{

    ctx.shadowColor="#ff9800";
    ctx.fillStyle="#ff9800";

    ctx.beginPath();
    ctx.arc(x,p.y,16,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="18px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("⚡",x,p.y);
  }

  ctx.restore();
}


/* -------------------------
   ROUND RECT
------------------------- */

function roundRect(x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);

  ctx.closePath();
}


/* -------------------------
   COLOR
------------------------- */

function shadeColor(hex,percent){

  const num=parseInt(hex.replace("#",""),16);

  let r=(num>>16)+Math.round(2.55*percent);
  let g=((num>>8)&255)+Math.round(2.55*percent);
  let b=(num&255)+Math.round(2.55*percent);

  r=Math.max(0,Math.min(255,r));
  g=Math.max(0,Math.min(255,g));
  b=Math.max(0,Math.min(255,b));

  return `rgb(${r},${g},${b})`;
}


/* -------------------------
   UPDATE
------------------------- */

function update(){

  frame++;

  spawnTimer++;
  coinTimer++;
  powerTimer++;

  /* Level */

  level=1+Math.floor(score/100);

  /* Difficulty */

  speed=4+(level-1)*0.45;

  /* Nitro */

  if(nitroActive){

    if(nitro>0){

      nitro-=0.8;

    }else{

      nitroActive=false;
    }

  }else{

    nitro=Math.min(100,nitro+0.08);
  }

  const actualSpeed=
    nitroActive ? speed*1.8 : speed;

  /* Spawn cars */

  const spawnRate=
    Math.max(38-Math.floor(score/8),16);

  if(spawnTimer>spawnRate){

    spawnObstacle();

    spawnTimer=0;
  }

  /* Spawn coins */

  if(coinTimer>45){

    spawnCoin();

    coinTimer=0;
  }

  /* Spawn powerups */

  if(powerTimer>500){

    spawnPowerup();

    powerTimer=0;
  }

  /* Move objects */

  obstacles.forEach(o=>{
    o.y+=actualSpeed;
  });

  coinsOnRoad.forEach(c=>{
    c.y+=actualSpeed;
  });

  powerups.forEach(p=>{
    p.y+=actualSpeed;
  });

  /* Remove */

  obstacles=
    obstacles.filter(o=>o.y<H+100);

  coinsOnRoad=
    coinsOnRoad.filter(c=>c.y<H+50);

  powerups=
    powerups.filter(p=>p.y<H+50);

  /* Score */

  score=Math.floor(frame/10);

  /* Player position */

  const px=laneX(player.lane);

  /* -------------------------
     CAR COLLISIONS
  ------------------------- */

  for(const o of obstacles){

    const ox=laneX(o.lane);

    const collision=
      Math.abs(px-ox)<
      (player.width+o.width)/2-10 &&
      Math.abs(player.y-o.y)<
      (player.height+o.height)/2-10;

    if(collision){

      if(invincibleTimer>0){
        continue;
      }

      if(shield){

        shield=false;
        invincibleTimer=60;

        showMessage("🛡️ SHIELD SAVED YOU!");

        o.y=H+200;

      }else{

        lives--;

        invincibleTimer=90;

        showMessage("💥 CRASH!");

        o.y=H+200;

        if(lives<=0){

          endGame();
          return;
        }
      }
    }

    /* Near miss */

    if(
      !o.passed &&
      o.y>player.y+30 &&
      o.y<player.y+100
    ){

      o.passed=true;

      if(
        Math.abs(px-ox)<70 &&
        Math.abs(px-ox)>30
      ){

        score+=10;

        showMessage("🔥 NEAR MISS +10");
      }
    }
  }

  if(invincibleTimer>0){
    invincibleTimer--;
  }

  /* -------------------------
     COINS
  ------------------------- */

  for(const c of coinsOnRoad){

    if(c.collected)continue;

    const cx=laneX(c.lane);

    if(
      Math.abs(px-cx)<30 &&
      Math.abs(player.y-c.y)<55
    ){

      c.collected=true;

      coins++;

      localStorage.setItem(
        "carDodgeCoins",
        coins
      );

      showMessage("🪙 +1 COIN!");
    }
  }

  coinsOnRoad=
    coinsOnRoad.filter(c=>!c.collected);

  /* -------------------------
     POWERUPS
  ------------------------- */

  for(const p of powerups){

    if(p.collected)continue;

    const px2=laneX(p.lane);

    if(
      Math.abs(px-px2)<30 &&
      Math.abs(player.y-p.y)<55
    ){

      p.collected=true;

      if(p.type==="shield"){

        shield=true;
        showMessage("🛡️ SHIELD ACTIVE!");

      }else{

        nitro=Math.min(100,nitro+50);

        showMessage("⚡ NITRO +50!");
      }
    }
  }

  powerups=
    powerups.filter(p=>!p.collected);
}


/* -------------------------
   DRAW
------------------------- */

function draw(){

  drawRoad();

  /* Coins */

  coinsOnRoad.forEach(c=>{
    drawCoin(laneX(c.lane),c.y);
  });

  /* Powerups */

  powerups.forEach(p=>{
    drawPowerup(p);
  });

  /* Cars */

  obstacles.forEach(o=>{

    drawCar(
      laneX(o.lane),
      o.y,
      o.width,
      o.height,
      o.color,
      false
    );
  });

  /* Shield */

  if(shield){

    ctx.save();

    ctx.strokeStyle="#00e5ff";
    ctx.lineWidth=4;
    ctx.shadowColor="#00e5ff";
    ctx.shadowBlur=20;

    ctx.beginPath();

    ctx.arc(
      laneX(player.lane),
      player.y,
      45,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
  }

  /* Nitro flame */

  if(nitroActive){

    ctx.save();

    ctx.fillStyle="#ff9800";
    ctx.shadowColor="#ff5722";
    ctx.shadowBlur=20;

    ctx.beginPath();

    ctx.moveTo(
      laneX(player.lane)-10,
      player.y+38
    );

    ctx.lineTo(
      laneX(player.lane),
      player.y+65+Math.random()*15
    );

    ctx.lineTo(
      laneX(player.lane)+10,
      player.y+38
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
  }

  /* Player */

  const playerColor=
    invincibleTimer>0 && frame%8<4
      ? "#ffffff"
      : "#00e676";

  drawCar(
    laneX(player.lane),
    player.y,
    player.width,
    player.height,
    playerColor,
    true
  );

  /* HUD */

  document.getElementById("score").textContent=score;
  document.getElementById("coins").textContent=coins;
  document.getElementById("level").textContent=level;
  document.getElementById("nitro").textContent=Math.floor(nitro);

  document.getElementById("lives").textContent=
    "❤️".repeat(lives)+"🖤".repeat(3-lives);
}


/* -------------------------
   MESSAGE
------------------------- */

let messageTimeout;

function showMessage(text){

  const el=document.getElementById("message");

  el.textContent=text;

  clearTimeout(messageTimeout);

  messageTimeout=setTimeout(()=>{
    el.textContent="";
  },1200);
}


/* -------------------------
   GAME OVER
------------------------- */

function endGame(){

  running=false;

  nitroActive=false;

  if(score>best){

    best=score;

    localStorage.setItem(
      "carDodgeBest",
      best
    );
  }

  document.getElementById("finalScore").textContent=
    `🏁 Score: ${score}`;

  document.getElementById("finalCoins").textContent=
    `🪙 Coins: ${coins}`;

  document.getElementById("finalBest").textContent=
    `🏆 Best: ${best}`;

  document.getElementById("best").textContent=best;

  document.getElementById("overlay").style.display="flex";
}


/* -------------------------
   MOVEMENT
------------------------- */

function moveLeft(){

  if(!running)return;

  if(player.lane>0){
    player.lane--;
  }
}

function moveRight(){

  if(!running)return;

  if(player.lane<laneCount-1){
    player.lane++;
  }
}


/* -------------------------
   NITRO
------------------------- */

function startNitro(){

  if(!running)return;

  if(nitro>5){

    nitroActive=true;

    showMessage("🚀 NITRO BOOST!");
  }
}

function stopNitro(){

  nitroActive=false;
}


/* -------------------------
   KEYBOARD
------------------------- */

window.addEventListener("keydown",e=>{

  if(
    ["ArrowLeft","ArrowRight"," ","a","A","d","D"]
    .includes(e.key)
  ){
    e.preventDefault();
  }

  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"){
    moveLeft();
  }

  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D"){
    moveRight();
  }

  if(e.key===" "){
    startNitro();
  }

},{passive:false});


window.addEventListener("keyup",e=>{

  if(e.key===" "){
    stopNitro();
  }

});


/* -------------------------
   MOBILE BUTTONS
------------------------- */

document.getElementById("leftBtn")
.addEventListener("click",moveLeft);

document.getElementById("rightBtn")
.addEventListener("click",moveRight);

const nitroBtn=
  document.getElementById("nitroBtn");

nitroBtn.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    startNitro();
  },
  {passive:false}
);

nitroBtn.addEventListener(
  "touchend",
  e=>{
    e.preventDefault();
    stopNitro();
  },
  {passive:false}
);

nitroBtn.addEventListener(
  "mousedown",
  startNitro
);

nitroBtn.addEventListener(
  "mouseup",
  stopNitro
);

nitroBtn.addEventListener(
  "mouseleave",
  stopNitro
);


/* -------------------------
   SWIPE
------------------------- */

let touchStartX=null;
let touchMoved=false;

const SWIPE_THRESHOLD=30;

canvas.addEventListener(
  "touchstart",
  e=>{

    const t=e.touches[0];

    touchStartX=t.clientX;
    touchMoved=false;

  },
  {passive:false}
);

canvas.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    if(touchStartX===null)return;

    const t=e.touches[0];

    const dx=t.clientX-touchStartX;

    if(
      Math.abs(dx)>SWIPE_THRESHOLD &&
      !touchMoved
    ){

      touchMoved=true;

      if(dx>0){
        moveRight();
      }else{
        moveLeft();
      }
    }

  },
  {passive:false}
);

canvas.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    if(!running){

      resetGame();

      touchStartX=null;

      return;
    }

    if(
      !touchMoved &&
      touchStartX!==null
    ){

      const rect=
        canvas.getBoundingClientRect();

      const relativeX=
        touchStartX-rect.left;

      if(relativeX<rect.width/2){
        moveLeft();
      }else{
        moveRight();
      }
    }

    touchStartX=null;
    touchMoved=false;

  },
  {passive:false}
);


/* -------------------------
   RESTART
------------------------- */

document.getElementById("restartBtn")
.addEventListener(
  "click",
  resetGame
);


/* -------------------------
   START
------------------------- */

window.addEventListener("load", function () {
  console.log("GAME STARTING");
  resetGame();
  draw();
});

</script>

</body>
  </html>
