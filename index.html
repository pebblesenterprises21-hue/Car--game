<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>🚗 Color Car Dodge</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(160deg,#10002b,#260052,#4b0082);
  touch-action:none;
  overscroll-behavior:none;
}

body{
  display:flex;
  justify-content:center;
}

#wrap{
  width:100%;
  max-width:420px;
  padding:8px;
  text-align:center;
}

h2{
  margin:4px 0;
  font-size:27px;
  background:linear-gradient(90deg,#00e5ff,#76ff03,#ffea00,#ff4081);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

#hud{
  font-size:15px;
  font-weight:bold;
  line-height:1.8;
  color:#ffd740;
}

#hud span{
  color:white;
}

#message{
  height:22px;
  font-weight:bold;
  font-size:15px;
}

canvas{
  display:block;
  width:100%;
  max-width:360px;
  height:auto;
  margin:5px auto;
  border:4px solid white;
  border-radius:14px;
  background:#58a82e;
  box-shadow:0 0 22px #000;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin-top:8px;
}

button{
  border:0;
  color:white;
  font-weight:bold;
  user-select:none;
  -webkit-user-select:none;
}

.ctrl{
  width:65px;
  height:58px;
  border-radius:16px;
  background:#292929;
  font-size:25px;
  box-shadow:0 4px 10px #0008;
}

.ctrl:active{
  transform:scale(.92);
}

#nitroBtn{
  width:125px;
  background:linear-gradient(135deg,#ff1744,#ff9100);
  font-size:17px;
}

.small{
  font-size:12px;
  opacity:.75;
}

#overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#000d;
  z-index:10;
}

#overlay h1{
  font-size:38px;
  color:#ffca28;
}

#overlay p{
  font-size:20px;
  margin:5px;
}

#restart{
  margin-top:15px;
  padding:13px 28px;
  border-radius:12px;
  background:#00c853;
  font-size:18px;
}
</style>
</head>

<body>

<div id="wrap">

<h2>🏎️ COLOR CAR DODGE</h2>

<div id="hud">
Score: <span id="score">0</span> |
Best: <span id="best">0</span><br>

🪙 <span id="coins">0</span> |
<span id="lives">❤️❤️❤️</span> |
🏁 Level <span id="level">1</span> |
🚀 <span id="nitro">100</span>%
</div>

<div id="message"></div>

<canvas id="game" width="360" height="600"></canvas>

<div class="controls">
<button class="ctrl" id="left">⬅️</button>
<button class="ctrl" id="nitroBtn">🚀 NITRO</button>
<button class="ctrl" id="right">➡️</button>
</div>

<p class="small">
Swipe left/right or use the buttons
</p>

</div>

<div id="overlay">

<h1>💥 GAME OVER</h1>

<p id="finalScore"></p>
<p id="finalCoins"></p>
<p id="finalBest"></p>

<button id="restart">🚗 PLAY AGAIN</button>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=360;
const H=600;

const lanes=3;
const laneWidth=W/lanes;

const player={
  lane:1,
  y:505,
  width:46,
  height:78
};

let enemies=[];
let coinsRoad=[];
let powers=[];

let frame=0;
let score=0;
let bonus=0;

let lives=3;
let level=1;

let speed=3.8;

let coinCount=
Number(localStorage.getItem("carCoins")||0);

let best=
Number(localStorage.getItem("carBest")||0);

let nitro=100;
let nitroOn=false;

let shield=false;
let invincible=0;

let running=false;
let loopStarted=false;

document.getElementById("best").textContent=best;
document.getElementById("coins").textContent=coinCount;


/* =========================
   LANE
========================= */

function laneX(lane){
  return lane*laneWidth+laneWidth/2;
}


/* =========================
   RESET
========================= */

function resetGame(){

  enemies=[];
  coinsRoad=[];
  powers=[];

  frame=0;
  score=0;
  bonus=0;

  lives=3;
  level=1;

  speed=3.8;

  nitro=100;
  nitroOn=false;

  shield=false;
  invincible=0;

  player.lane=1;

  running=true;

  document.getElementById("overlay").style.display="none";

  /* Start with only TWO cars */
  createEnemy(0, -120);
  createEnemy(2, -330);

  draw();

  if(!loopStarted){
    loopStarted=true;
    requestAnimationFrame(loop);
  }
}


/* =========================
   CREATE ENEMY
========================= */

function createEnemy(lane,y){

  const designs=[
    {
      body:"#ff1744",
      roof:"#ff5252",
      stripe:"#fff",
      light:"#fff176"
    },
    {
      body:"#2979ff",
      roof:"#448aff",
      stripe:"#ffeb3b",
      light:"#fff"
    },
    {
      body:"#00c853",
      roof:"#69f0ae",
      stripe:"#fff",
      light:"#ffeb3b"
    },
    {
      body:"#ff6d00",
      roof:"#ffab40",
      stripe:"#212121",
      light:"#fff176"
    },
    {
      body:"#aa00ff",
      roof:"#e040fb",
      stripe:"#00e5ff",
      light:"#fff"
    }
  ];

  const d=
    designs[
      Math.floor(Math.random()*designs.length)
    ];

  enemies.push({
    lane:lane,
    y:y,
    width:46,
    height:78,
    body:d.body,
    roof:d.roof,
    stripe:d.stripe,
    light:d.light,
    passed:false,
    speedOffset:0.4+Math.random()*1.0
  });
}


/* =========================
   SPAWN ENEMY
========================= */

function spawnEnemy(){

  /* Never allow more than 3 cars */

  if(enemies.length>=3)return;

  let lane=Math.floor(Math.random()*3);

  /* Try to choose an empty lane */

  for(let i=0;i<3;i++){

    if(
      !enemies.some(e=>e.lane===lane)
    )break;

    lane=Math.floor(Math.random()*3);
  }

  createEnemy(
    lane,
    -100-Math.random()*120
  );
}


/* =========================
   COIN
========================= */

function spawnCoin(){

  const lane=
    Math.floor(Math.random()*3);

  coinsRoad.push({
    lane:lane,
    y:-20,
    taken:false
  });
}


/* =========================
   POWER
========================= */

function spawnPower(){

  const lane=
    Math.floor(Math.random()*3);

  powers.push({
    lane:lane,
    y:-30,
    type:Math.random()<.5
      ?"shield"
      :"nitro",
    taken:false
  });
}


/* =========================
   UPDATE
========================= */

function update(){

  frame++;

  level=
    1+Math.floor(score/120);

  speed=
    3.8+(level-1)*.35;

  if(nitroOn){

    nitro-=.75;

    if(nitro<=0){
      nitro=0;
      nitroOn=false;
    }

  }else{

    nitro=Math.min(
      100,
      nitro+.05
    );
  }

  const roadSpeed=
    nitroOn
      ?speed*1.7
      :speed;


  /* MOVE ALL CARS */

  enemies.forEach(e=>{

    e.y+=
      roadSpeed+
      e.speedOffset;

  });


  /* Remove cars */

  enemies=
    enemies.filter(e=>e.y<H+120);


  /* Add cars slowly */

  if(
    frame%100===0 &&
    enemies.length<3
  ){
    spawnEnemy();
  }


  /* Coins */

  if(frame%55===0){
    spawnCoin();
  }


  /* Powerups */

  if(frame%600===0){
    spawnPower();
  }


  coinsRoad.forEach(c=>{
    c.y+=roadSpeed;
  });

  powers.forEach(p=>{
    p.y+=roadSpeed;
  });


  coinsRoad=
    coinsRoad.filter(
      c=>c.y<H+40&&!c.taken
    );

  powers=
    powers.filter(
      p=>p.y<H+40&&!p.taken
    );


  /* SCORE */

  score=
    Math.floor(frame/10)+bonus;


  const px=
    laneX(player.lane);


  /* =====================
     CAR COLLISION
  ===================== */

  for(const e of enemies){

    const ex=
      laneX(e.lane);

    const hit=
      Math.abs(px-ex)<35 &&
      Math.abs(player.y-e.y)<58;


    if(hit && invincible<=0){

      if(shield){

        shield=false;
        invincible=80;

        e.y=H+200;

        message("🛡️ SHIELD SAVED YOU!");

      }else{

        lives--;
        invincible=100;

        e.y=H+200;

        message("💥 CRASH!");

        if(lives<=0){

          gameOver();
          return;
        }
      }
    }


    /* NEAR MISS */

    if(
      !e.passed &&
      e.y>player.y+40
    ){

      e.passed=true;

      const d=Math.abs(px-ex);

      if(d>28&&d<70){

        bonus+=10;

        message("🔥 NEAR MISS +10");

      }
    }

  }


  if(invincible>0){
    invincible--;
  }


  /* =====================
     COINS
  ===================== */

  for(const c of coinsRoad){

    if(c.taken)continue;

    const cx=
      laneX(c.lane);

    if(
      Math.abs(px-cx)<30 &&
      Math.abs(player.y-c.y)<55
    ){

      c.taken=true;

      coinCount++;

      localStorage.setItem(
        "carCoins",
        coinCount
      );

      message("🪙 +1 COIN!");

    }

  }


  /* =====================
     POWERUPS
  ===================== */

  for(const p of powers){

    if(p.taken)continue;

    const x=
      laneX(p.lane);

    if(
      Math.abs(px-x)<30 &&
      Math.abs(player.y-p.y)<55
    ){

      p.taken=true;

      if(p.type==="shield"){

        shield=true;

        message("🛡️ SHIELD!");

      }else{

        nitro=
          Math.min(100,nitro+50);

        message("⚡ NITRO +50!");

      }

    }

  }


  updateHUD();
}


/* =========================
   ROAD
========================= */

function drawRoad(){

  /* GRASS */

  const grass=
    ctx.createLinearGradient(
      0,0,0,H
    );

  grass.addColorStop(
    0,
    "#76c442"
  );

  grass.addColorStop(
    1,
    "#388e3c"
  );

  ctx.fillStyle=grass;

  ctx.fillRect(
    0,0,W,H
  );


  /* ROAD */

  const roadLeft=18;
  const roadRight=W-18;

  const roadGrad=
    ctx.createLinearGradient(
      0,0,0,H
    );

  roadGrad.addColorStop(
    0,
    "#444"
  );

  roadGrad.addColorStop(
    .5,
    "#5b5b5b"
  );

  roadGrad.addColorStop(
    1,
    "#383838"
  );

  ctx.fillStyle=roadGrad;

  ctx.fillRect(
    roadLeft,
    0,
    roadRight-roadLeft,
    H
  );


  /* ROAD SHOULDERS */

  ctx.fillStyle="#eee";

  ctx.fillRect(
    roadLeft,
    0,
    5,
    H
  );

  ctx.fillRect(
    roadRight-5,
    0,
    5,
    H
  );


  /* RED / WHITE EDGE */

  const edgeOffset=
    (frame*speed)%32;

  for(
    let y=-32+edgeOffset;
    y<H;
    y+=32
  ){

    ctx.fillStyle="#e53935";

    ctx.fillRect(
      roadLeft+5,
      y,
      12,
      16
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(
      roadLeft+5,
      y+16,
      12,
      16
    );


    ctx.fillStyle="#e53935";

    ctx.fillRect(
      roadRight-17,
      y,
      12,
      16
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(
      roadRight-17,
      y+16,
      12,
      16
    );

  }


  /* LANE MARKINGS */

  ctx.lineWidth=4;

  for(let i=1;i<3;i++){

    let y=
      -(frame*speed)%48;

    while(y<H){

      ctx.strokeStyle="#fff";

      ctx.beginPath();

      ctx.moveTo(
        i*laneWidth,
        y
      );

      ctx.lineTo(
        i*laneWidth,
        y+25
      );

      ctx.stroke();

      y+=48;

    }

  }


  /* TREES */

  for(
    let y=-50+(frame*speed)%100;
    y<H;
    y+=100
  ){

    drawTree(7,y);
    drawTree(W-7,y+45);

  }

}


/* =========================
   TREE
========================= */

function drawTree(x,y){

  ctx.fillStyle="#6d4c41";

  ctx.fillRect(
    x-3,
    y+14,
    6,
    18
  );

  ctx.fillStyle="#1b5e20";

  ctx.beginPath();

  ctx.arc(
    x,
    y+10,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#2e7d32";

  ctx.beginPath();

  ctx.arc(
    x-7,
    y+17,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =========================
   CAR DESIGN
========================= */

function drawCar(
  x,
  y,
  w,
  h,
  body,
  roof,
  stripe,
  light,
  isPlayer=false
){

  ctx.save();

  if(isPlayer){

    ctx.shadowColor=
      "#00e5ff";

    ctx.shadowBlur=20;

  }


  /* BODY */

  const gradient=
    ctx.createLinearGradient(
      x-w/2,
      y-h/2,
      x+w/2,
      y+h/2
    );

  gradient.addColorStop(
    0,
    shade(body,35)
  );

  gradient.addColorStop(
    .5,
    body
  );

  gradient.addColorStop(
    1,
    shade(body,-25)
  );

  ctx.fillStyle=gradient;

  roundRect(
    x-w/2,
    y-h/2,
    w,
    h,
    11
  );

  ctx.fill();


  /* ROOF */

  ctx.fillStyle=roof;

  roundRect(
    x-w/2+7,
    y-h/2+13,
    w-14,
    h*.38,
    9
  );

  ctx.fill();


  /* WINDOWS */

  ctx.fillStyle="#102a43";

  roundRect(
    x-w/2+10,
    y-h/2+17,
    w-20,
    h*.25,
    6
  );

  ctx.fill();


  /* WINDOW DIVIDER */

  ctx.fillStyle="#b3e5fc";

  ctx.fillRect(
    x-2,
    y-h/2+18,
    4,
    h*.22
  );


  /* COLOUR STRIPE */

  ctx.fillStyle=stripe;

  ctx.fillRect(
    x-w/2+3,
    y-4,
    w-6,
    7
  );


  /* HEADLIGHTS */

  ctx.fillStyle=light;

  ctx.shadowColor=light;
  ctx.shadowBlur=8;

  ctx.fillRect(
    x-w/2+5,
    y-h/2+5,
    9,
    7
  );

  ctx.fillRect(
    x+w/2-14,
    y-h/2+5,
    9,
    7
  );

  ctx.shadowBlur=0;


  /* TAIL LIGHTS */

  ctx.fillStyle="#ff1744";

  ctx.fillRect(
    x-w/2+5,
    y+h/2-12,
    8,
    7
  );

  ctx.fillRect(
    x+w/2-13,
    y+h/2-12,
    8,
    7
  );


  /* WHEELS */

  ctx.fillStyle="#111";

  ctx.fillRect(
    x-w/2-4,
    y-h/2+15,
    7,
    20
  );

  ctx.fillRect(
    x+w/2-3,
    y-h/2+15,
    7,
    20
  );

  ctx.fillRect(
    x-w/2-4,
    y+h/2-35,
    7,
    20
  );

  ctx.fillRect(
    x+w/2-3,
    y+h/2-35,
    7,
    20
  );


  /* SHINE */

  ctx.fillStyle="rgba(255,255,255,.3)";

  ctx.fillRect(
    x-w/2+5,
    y-h/2+5,
    4,
    h-10
  );


  ctx.restore();

}


/* =========================
   COIN
========================= */

function drawCoin(x,y){

  ctx.save();

  ctx.shadowColor="#ffd700";
  ctx.shadowBlur=15;

  ctx.fillStyle="#ffd700";

  ctx.beginPath();

  ctx.arc(
    x,y,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#fff59d";

  ctx.beginPath();

  ctx.arc(
    x,y,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#d68900";

  ctx.font="bold 11px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "$",
    x,
    y
  );

  ctx.restore();

}


/* =========================
   POWER
========================= */

function drawPower(p){

  const x=
    laneX(p.lane);

  ctx.save();

  ctx.shadowBlur=18;

  ctx.fillStyle=
    p.type==="shield"
      ?"cyan"
      :"orange";

  ctx.beginPath();

  ctx.arc(
    x,
    p.y,
    17,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.font="18px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    p.type==="shield"
      ?"🛡️"
      :"⚡",
    x,
    p.y
  );

  ctx.restore();

}


/* =========================
   DRAW
========================= */

function draw(){

  drawRoad();


  coinsRoad.forEach(c=>{

    drawCoin(
      laneX(c.lane),
      c.y
    );

  });


  powers.forEach(p=>{

    drawPower(p);

  });


  enemies.forEach(e=>{

    drawCar(
      laneX(e.lane),
      e.y,
      e.width,
      e.height,
      e.body,
      e.roof,
      e.stripe,
      e.light
    );

  });


  /* SHIELD */

  if(shield){

    ctx.save();

    ctx.strokeStyle="#00e5ff";
    ctx.lineWidth=4;
    ctx.shadowColor="#00e5ff";
    ctx.shadowBlur=20;

    ctx.beginPath();

    ctx.arc(
      laneX(player.lane),
      player.y,
      45,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

  }


  /* NITRO */

  if(nitroOn){

    ctx.save();

    ctx.fillStyle="#ff9800";
    ctx.shadowColor="#ff5722";
    ctx.shadowBlur=20;

    ctx.beginPath();

    ctx.moveTo(
      laneX(player.lane)-10,
      player.y+38
    );

    ctx.lineTo(
      laneX(player.lane),
      player.y+72+
      Math.random()*10
    );

    ctx.lineTo(
      laneX(player.lane)+10,
      player.y+38
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

  }


  /* PLAYER */

  const flashing=
    invincible>0 &&
    frame%8<4;

  drawCar(
    laneX(player.lane),
    player.y,
    player.width,
    player.height,
    flashing
      ?"#ffffff"
      :"#00e676",
    flashing
      ?"#ffffff"
      :"#69f0ae",
    "#00e5ff",
    "#fff176",
    true
  );

}


/* =========================
   SHADE
========================= */

function shade(hex,p){

  const n=
    parseInt(
      hex.replace("#",""),
      16
    );

  let r=(n>>16)+Math.round(2.55*p);
  let g=((n>>8)&255)+Math.round(2.55*p);
  let b=(n&255)+Math.round(2.55*p);

  r=Math.max(0,Math.min(255,r));
  g=Math.max(0,Math.min(255,g));
  b=Math.max(0,Math.min(255,b));

  return `rgb(${r},${g},${b})`;

}


/* =========================
   ROUND RECT
========================= */

function roundRect(x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    r
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    r
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    r
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    r
  );

  ctx.closePath();

}


/* =========================
   HUD
========================= */

function updateHUD(){

  document.getElementById("score").textContent=score;
  document.getElementById("best").textContent=best;
  document.getElementById("coins").textContent=coinCount;
  document.getElementById("level").textContent=level;
  document.getElementById("nitro").textContent=Math.floor(nitro);

  document.getElementById("lives").textContent=
    "❤️".repeat(lives)+
    "🖤".repeat(3-lives);

}


/* =========================
   MESSAGE
========================= */

let msgTimer;

function message(text){

  const el=
    document.getElementById("message");

  el.textContent=text;

  clearTimeout(msgTimer);

  msgTimer=setTimeout(
    ()=>{
      el.textContent="";
    },
    1200
  );

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  running=false;
  nitroOn=false;

  if(score>best){

    best=score;

    localStorage.setItem(
      "carBest",
      best
    );

  }

  document.getElementById(
    "finalScore"
  ).textContent=
    "🏁 Score: "+score;

  document.getElementById(
    "finalCoins"
  ).textContent=
    "🪙 Coins: "+coinCount;

  document.getElementById(
    "finalBest"
  ).textContent=
    "🏆 Best: "+best;

  document.getElementById(
    "overlay"
  ).style.display="flex";

}


/* =========================
   LOOP
========================= */

function loop(){

  if(!running){

    loopStarted=false;
    return;

  }

  update();
  draw();

  requestAnimationFrame(loop);

}


/* =========================
   MOVEMENT
========================= */

function leftMove(){

  if(player.lane>0){
    player.lane--;
  }

}

function rightMove(){

  if(player.lane<2){
    player.lane++;
  }

}


/* =========================
   NITRO
========================= */

function startNitro(){

  if(
    running &&
    nitro>5
  ){

    nitroOn=true;

    message("🚀 NITRO!");

  }

}

function stopNitro(){

  nitroOn=false;

}


/* =========================
   BUTTONS
========================= */

document
.getElementById("left")
.addEventListener(
  "click",
  leftMove
);

document
.getElementById("right")
.addEventListener(
  "click",
  rightMove
);

const nitroButton=
document.getElementById(
  "nitroBtn"
);

nitroButton.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    startNitro();
  }
);

nitroButton.addEventListener(
  "pointerup",
  stopNitro
);

nitroButton.addEventListener(
  "pointercancel",
  stopNitro
);

nitroButton.addEventListener(
  "pointerleave",
  stopNitro
);


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft"||
      e.key==="a"||
      e.key==="A"
    ){
      leftMove();
    }

    if(
      e.key==="ArrowRight"||
      e.key==="d"||
      e.key==="D"
    ){
      rightMove();
    }

    if(e.key===" "){
      e.preventDefault();
      startNitro();
    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(e.key===" "){
      stopNitro();
    }

  }
);


/* =========================
   SWIPE
========================= */

let startX=null;
let moved=false;

canvas.addEventListener(
  "touchstart",
  e=>{

    startX=
      e.touches[0].clientX;

    moved=false;

  },
  {passive:false}
);

canvas.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    if(startX===null)return;

    const dx=
      e.touches[0].clientX-startX;

    if(
      Math.abs(dx)>30 &&
      !moved
    ){

      moved=true;

      if(dx>0){
        rightMove();
      }else{
        leftMove();
      }

    }

  },
  {passive:false}
);

canvas.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    if(!moved&&startX!==null){

      const rect=
        canvas.getBoundingClientRect();

      const x=
        startX-rect.left;

      if(
        x<rect.width/2
      ){
        leftMove();
      }else{
        rightMove();
      }

    }

    startX=null;
    moved=false;

  },
  {passive:false}
);


/* =========================
   RESTART
========================= */

document
.getElementById("restart")
.addEventListener(
  "click",
  resetGame
);


/* =========================
   START
========================= */

window.addEventListener(
  "load",
  function(){

    resetGame();

  }
);

</script>
